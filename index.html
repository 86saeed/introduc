<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سید سعید پرهیزکار | s.saeed parhizkar</title>
    <link rel="shortcut icon" href="./logo.jpeg">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Tahoma', sans-serif;
            color: #ffffff;
        }
        
        .loading-text {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .dots {
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 15px;
            height: 15px;
            background-color: #ff0000;
            border-radius: 50%;
            animation: bounce 1s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        .dot:nth-child(1) { animation-delay: -0.3s; }
        .dot:nth-child(2) { animation-delay: -0.2s; }
        .dot:nth-child(3) { animation-delay: -0.1s; }

        @keyframes bounce {
            0%, 100% { transform: scale(0); }
            50% { transform: scale(1); }
        }
        .error-code {
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            line-height: 1;
            margin-bottom: 10px;
            /* انیمیشن تپش */
            animation: pulse-text 2s infinite ease-in-out;
        }
          @keyframes pulse-text {
            0% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
            50% { transform: scale(1.05); text-shadow: 0 0 40px rgba(255, 0, 0, 0.9); }
            100% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
        }

    </style>
</head>
<body>
    <div class="loading-text"><h2 style="text-align: center;">لطفاً شکیبا باشید</h2>
    <h4 class="error-code">به دلیل مشکلات سرور شاید بارگذاری کمی طول بکشد</h4></div>
    
    <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <script>
        // بعد از 1 ثانیه به صفحه اصلی هدایت می‌شود
        setTimeout(function() {
            window.location.href = "main.html"; 
        }, 4000);
    </script>
</body>
</html>
